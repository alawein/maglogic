name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: package and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation tools
        run: python -m pip install --upgrade pip build cffconvert
      - name: Validate citation metadata
        run: cffconvert --validate -i CITATION.cff
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect source distribution policy
        run: |
          tar -tzf dist/*.tar.gz > sdist-contents.txt
          ! grep -E '(^|/)(\.github|\.claude|\.cursor|\.outpost|docker|docs|examples|python/tests)(/|$)' sdist-contents.txt
          ! grep -E '/(AGENTS|CLAUDE|LESSONS|SSOT|SECURITY|CONTRIBUTING)\.md$' sdist-contents.txt
      - name: Clean-install wheel and test
        shell: bash
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/pip install dist/*.whl pytest pytest-cov pytest-benchmark
          .venv-wheel/bin/python -c "import maglogic; print(maglogic.__version__)"
          .venv-wheel/bin/python -c "from maglogic.demos.demo_nand_nor import NANDNORDemo; print(NANDNORDemo.__name__)"
          .venv-wheel/bin/python -m pytest python/tests -q
      - name: Smoke-test documented analysis example
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          rm -rf triangle_output
          .venv-wheel/bin/python examples/run_basic_triangle.py
          test -f triangle_output/triangle_states.png
          test -f triangle_output/parameter_space.png
      - name: Check safe Docker configuration policy
        run: |
          ! grep -R -E "(JUPYTER_TOKEN|POSTGRES_PASSWORD)=\$\{[^}]*:-" docker
          ! grep -R -E "ServerApp\.(token|password)=''" docker
          test -f docker/.env.example
