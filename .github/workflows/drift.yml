name: drift

on:
  pull_request:
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'
      - '**/*.gif'
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # repo-drift v0.1.0
      - uses: alawein/repo-drift@c9937d8df883da3f1561361e7b006201d380f07b
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
